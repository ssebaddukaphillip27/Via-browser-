<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Via Browser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --accent: #e94560;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border: rgba(255,255,255,0.08);
            --hover: rgba(255,255,255,0.05);
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .light-mode {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #e8e8ed;
            --accent: #e94560;
            --text-primary: #1a1a2e;
            --text-secondary: #666680;
            --border: rgba(0,0,0,0.08);
            --hover: rgba(0,0,0,0.03);
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 4px 8px;
            min-height: 40px;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tab-bar::-webkit-scrollbar {
            display: none;
        }

        .tab {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            border-radius: 8px;
            white-space: nowrap;
            max-width: 180px;
            min-width: 100px;
            transition: all 0.2s ease;
            gap: 8px;
        }

        .tab:hover {
            background: var(--hover);
        }

        .tab.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            text-align: left;
        }

        .tab-close {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 10px;
            opacity: 0;
            transition: all 0.2s;
        }

        .tab:hover .tab-close {
            opacity: 1;
        }

        .tab-close:hover {
            background: var(--accent);
            color: white;
        }

        .tab-add {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .tab-add:hover {
            background: var(--hover);
            color: var(--accent);
        }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: var(--hover);
            color: var(--text-primary);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .url-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            gap: 8px;
            transition: all 0.3s;
        }

        .url-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(233, 69, 96, 0.2);
        }

        .url-bar .bi-lock, .url-bar .bi-globe {
            color: var(--text-secondary);
            font-size: 13px;
            flex-shrink: 0;
        }

        .url-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        .url-input::placeholder {
            color: var(--text-secondary);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .browser-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Home Page */
        .home-page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 40px 20px;
            overflow-y: auto;
        }

        .home-logo {
            font-size: 48px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .home-logo span {
            color: var(--text-primary);
        }

        .home-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .home-search {
            width: 100%;
            max-width: 560px;
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 20px;
            gap: 12px;
            margin-bottom: 40px;
            transition: all 0.3s;
        }

        .home-search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15);
        }

        .home-search input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
        }

        .home-search input::placeholder {
            color: var(--text-secondary);
        }

        .home-search .search-icon {
            color: var(--text-secondary);
            font-size: 18px;
        }

        .search-engine-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--bg-tertiary);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .search-engine-selector:hover {
            color: var(--text-primary);
        }

        /* Quick Links */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 16px;
            max-width: 560px;
            width: 100%;
            margin-bottom: 32px;
        }

        .quick-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .quick-link:hover {
            background: var(--hover);
            transform: translateY(-2px);
        }

        .quick-link-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .quick-link-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Side Panel */
        .side-panel {
            position: absolute;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            z-index: 100;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .side-panel.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .panel-close {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
        }

        .panel-close:hover {
            background: var(--hover);
            color: var(--text-primary);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .panel-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            gap: 12px;
            transition: all 0.2s;
        }

        .panel-item:hover {
            background: var(--hover);
        }

        .panel-item-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .panel-item-info {
            flex: 1;
            min-width: 0;
        }

        .panel-item-title {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel-item-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel-item-delete {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: all 0.2s;
        }

        .panel-item:hover .panel-item-delete {
            opacity: 1;
        }

        .panel-item-delete:hover {
            color: var(--accent);
        }

        /* Settings Panel */
        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            padding: 8px 12px;
            font-weight: 600;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-item:hover {
            background: var(--hover);
        }

        .settings-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-item-left i {
            font-size: 16px;
            color: var(--text-secondary);
            width: 20px;
            text-align: center;
        }

        .settings-item-label {
            font-size: 13px;
        }

        /* Toggle Switch */
        .toggle {
            width: 40px;
            height: 22px;
            background: var(--bg-tertiary);
            border-radius: 11px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle.active {
            background: var(--accent);
        }

        .toggle::after {
            content: '';
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle.active::after {
            left: 20px;
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        .bottom-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            font-size: 18px;
            transition: all 0.2s;
        }

        .bottom-btn:hover {
            color: var(--text-primary);
            background: var(--hover);
        }

        .bottom-btn span {
            font-size: 9px;
            margin-top: 2px;
        }

        /* Loading Bar */
        .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
            z-index: 50;
        }

        /* Context Menu */
        .context-menu {
            position: absolute;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px;
            min-width: 180px;
            box-shadow: var(--shadow);
            z-index: 200;
            display: none;
        }

        .context-menu.show {
            display: block;
        }

        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            transition: all 0.15s;
        }

        .context-menu-item:hover {
            background: var(--hover);
        }

        .context-menu-item i {
            width: 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .context-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 8px;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .overlay.show {
            display: block;
            opacity: 1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 300;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Search Engine Dropdown */
        .engine-dropdown {
            position: absolute;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px;
            min-width: 160px;
            box-shadow: var(--shadow);
            z-index: 200;
            display: none;
        }

        .engine-dropdown.show {
            display: block;
        }

        .engine-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
        }

        .engine-option:hover {
            background: var(--hover);
        }

        .engine-option.active {
            color: var(--accent);
        }

        /* Tab Overview */
        .tab-overview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 80;
            display: none;
            padding: 20px;
            overflow-y: auto;
        }

        .tab-overview.show {
            display: block;
        }

        .tab-overview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .tab-overview-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .tab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .tab-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .tab-card.active {
            border-color: var(--accent);
        }

        .tab-card-preview {
            height: 120px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--text-secondary);
        }

        .tab-card-info {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tab-card-title {
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .tab-card-close {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
        }

        .tab-card-close:hover {
            background: var(--accent);
            color: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .quick-links {
                grid-template-columns: repeat(4, 1fr);
            }
            .side-panel {
                width: 100%;
                right: -100%;
            }
            .tab {
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Tab Bar -->
    <div class="tab-bar" id="tabBar">
        <button class="tab-add" id="addTabBtn" title="New Tab">
            <i class="bi bi-plus"></i>
        </button>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-btn" id="backBtn" title="Back" disabled>
            <i class="bi bi-chevron-left"></i>
        </button>
        <button class="nav-btn" id="forwardBtn" title="Forward" disabled>
            <i class="bi bi-chevron-right"></i>
        </button>
        <button class="nav-btn" id="refreshBtn" title="Refresh">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="nav-btn" id="homeBtn" title="Home">
            <i class="bi bi-house"></i>
        </button>
        <div class="url-bar">
            <i class="bi bi-globe" id="urlIcon"></i>
            <input type="text" class="url-input" id="urlInput" placeholder="Search or enter URL" spellcheck="false">
        </div>
        <button class="nav-btn" id="bookmarkBtn" title="Bookmark">
            <i class="bi bi-star"></i>
        </button>
        <button class="nav-btn" id="menuBtn" title="Menu">
            <i class="bi bi-three-dots-vertical"></i>
        </button>
    </div>

    <!-- Content Area -->
    <div class="content-area" id="contentArea">
        <div class="loading-bar" id="loadingBar" style="width: 0%"></div>
        
        <!-- Home Page -->
        <div class="home-page" id="homePage">
            <div class="home-logo">Via<span>Browser</span></div>
            <div class="home-subtitle">Fast, lightweight & private</div>
            
            <div class="home-search" id="homeSearch">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="homeSearchInput" placeholder="Search the web..." spellcheck="false">
                <div class="search-engine-selector" id="engineSelector">
                    <i class="bi bi-google"></i>
                    <span id="engineName">Google</span>
                    <i class="bi bi-chevron-down" style="font-size:10px"></i>
                </div>
            </div>

            <div class="quick-links" id="quickLinks">
                <div class="quick-link" data-url="https://www.google.com">
                    <div class="quick-link-icon" style="background: #4285f4"><i class="bi bi-google"></i></div>
                    <span class="quick-link-label">Google</span>
                </div>
                <div class="quick-link" data-url="https://www.youtube.com">
                    <div class="quick-link-icon" style="background: #ff0000"><i class="bi bi-youtube"></i></div>
                    <span class="quick-link-label">YouTube</span>
                </div>
                <div class="quick-link" data-url="https://www.github.com">
                    <div class="quick-link-icon" style="background: #333"><i class="bi bi-github"></i></div>
                    <span class="quick-link-label">GitHub</span>
                </div>
                <div class="quick-link" data-url="https://www.wikipedia.org">
                    <div class="quick-link-icon" style="background: #636363"><i class="bi bi-book"></i></div>
                    <span class="quick-link-label">Wikipedia</span>
                </div>
                <div class="quick-link" data-url="https://www.reddit.com">
                    <div class="quick-link-icon" style="background: #ff4500"><i class="bi bi-reddit"></i></div>
                    <span class="quick-link-label">Reddit</span>
                </div>
                <div class="quick-link" data-url="https://twitter.com">
                    <div class="quick-link-icon" style="background: #1da1f2"><i class="bi bi-twitter-x"></i></div>
                    <span class="quick-link-label">Twitter</span>
                </div>
                <div class="quick-link" data-url="https://www.amazon.com">
                    <div class="quick-link-icon" style="background: #ff9900"><i class="bi bi-cart"></i></div>
                    <span class="quick-link-label">Amazon</span>
                </div>
                <div class="quick-link" data-url="https://news.ycombinator.com">
                    <div class="quick-link-icon" style="background: #ff6600"><i class="bi bi-newspaper"></i></div>
                    <span class="quick-link-label">HN</span>
                </div>
            </div>
        </div>

        <!-- Iframe for web content -->
        <iframe class="browser-frame" id="browserFrame" style="display:none" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>

        <!-- Side Panel -->
        <div class="overlay" id="overlay"></div>
        <div class="side-panel" id="sidePanel">
            <div class="panel-header">
                <h3 id="panelTitle">Bookmarks</h3>
                <button class="panel-close" id="panelClose"><i class="bi bi-x"></i></button>
            </div>
            <div class="panel-content" id="panelContent"></div>
        </div>

        <!-- Tab Overview -->
        <div class="tab-overview" id="tabOverview">
            <div class="tab-overview-header">
                <h2>Tabs</h2>
                <button class="nav-btn" id="closeOverview"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="tab-grid" id="tabGrid"></div>
        </div>

        <!-- Context Menu -->
        <div class="context-menu" id="contextMenu">
            <div class="context-menu-item" data-action="back"><i class="bi bi-chevron-left"></i> Back</div>
            <div class="context-menu-item" data-action="forward"><i class="bi bi-chevron-right"></i> Forward</div>
            <div class="context-menu-item" data-action="refresh"><i class="bi bi-arrow-clockwise"></i> Refresh</div>
            <div class="context-divider"></div>
            <div class="context-menu-item" data-action="bookmark"><i class="bi bi-star"></i> Bookmark</div>
            <div class="context-menu-item" data-action="history"><i class="bi bi-clock-history"></i> History</div>
            <div class="context-divider"></div>
            <div class="context-menu-item" data-action="nightmode"><i class="bi bi-moon"></i> Night Mode</div>
            <div class="context-menu-item" data-action="settings"><i class="bi bi-gear"></i> Settings</div>
        </div>

        <!-- Engine Dropdown -->
        <div class="engine-dropdown" id="engineDropdown">
            <div class="engine-option active" data-engine="google">
                <i class="bi bi-google"></i> Google
            </div>
            <div class="engine-option" data-engine="bing">
                <i class="bi bi-microsoft"></i> Bing
            </div>
            <div class="engine-option" data-engine="duckduckgo">
                <i class="bi bi-shield-check"></i> DuckDuckGo
            </div>
            <div class="engine-option" data-engine="yahoo">
                <i class="bi bi-yahoo"></i> Yahoo
            </div>
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <button class="bottom-btn" id="bottomBack">
            <i class="bi bi-chevron-left"></i>
            <span>Back</span>
        </button>
        <button class="bottom-btn" id="bottomForward">
            <i class="bi bi-chevron-right"></i>
            <span>Forward</span>
        </button>
        <button class="bottom-btn" id="bottomBookmarks">
            <i class="bi bi-star"></i>
            <span>Bookmarks</span>
        </button>
        <button class="bottom-btn" id="bottomTabs">
            <i class="bi bi-square"></i>
            <span>Tabs</span>
        </button>
        <button class="bottom-btn" id="bottomMenu">
            <i class="bi bi-three-dots"></i>
            <span>Menu</span>
        </button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // State
        let tabs = [];
        let activeTabId = null;
        let tabCounter = 0;
        let bookmarks = JSON.parse(localStorage.getItem('via_bookmarks') || '[]');
        let history = JSON.parse(localStorage.getItem('via_history') || '[]');
        let currentEngine = localStorage.getItem('via_engine') || 'google';
        let nightMode = localStorage.getItem('via_nightmode') === 'true';
        let adBlock = localStorage.getItem('via_adblock') === 'true';

        const searchEngines = {
            google: { name: 'Google', icon: 'bi-google', url: 'https://www.google.com/search?q=' },
            bing: { name: 'Bing', icon: 'bi-microsoft', url: 'https://www.bing.com/search?q=' },
            duckduckgo: { name: 'DuckDuckGo', icon: 'bi-shield-check', url: 'https://duckduckgo.com/?q=' },
            yahoo: { name: 'Yahoo', icon: 'bi-yahoo', url: 'https://search.yahoo.com/search?p=' }
        };

        // Elements
        const tabBar = document.getElementById('tabBar');
        const addTabBtn = document.getElementById('addTabBtn');
        const backBtn = document.getElementById('backBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const homeBtn = document.getElementById('homeBtn');
        const urlInput = document.getElementById('urlInput');
        const urlIcon = document.getElementById('urlIcon');
        const bookmarkBtn = document.getElementById('bookmarkBtn');
        const menuBtn = document.getElementById('menuBtn');
        const contentArea = document.getElementById('contentArea');
        const homePage = document.getElementById('homePage');
        const browserFrame = document.getElementById('browserFrame');
        const loadingBar = document.getElementById('loadingBar');
        const sidePanel = document.getElementById('sidePanel');
        const overlay = document.getElementById('overlay');
        const panelTitle = document.getElementById('panelTitle');
        const panelContent = document.getElementById('panelContent');
        const panelClose = document.getElementById('panelClose');
        const contextMenu = document.getElementById('contextMenu');
        const engineDropdown = document.getElementById('engineDropdown');
        const engineSelector = document.getElementById('engineSelector');
        const homeSearchInput = document.getElementById('homeSearchInput');
        const tabOverview = document.getElementById('tabOverview');
        const tabGrid = document.getElementById('tabGrid');
        const toast = document.getElementById('toast');

        // Initialize
        if (nightMode) document.body.classList.add('light-mode');
        updateEngineUI();
        createTab();

        // Tab Management
        function createTab(url = null) {
            const id = ++tabCounter;
            const tab = {
                id,
                title: 'New Tab',
                url: url || '',
                history: [],
                historyIndex: -1,
                isHome: !url
            };
            tabs.push(tab);
            switchTab(id);
            renderTabs();
            if (url) navigateTo(url);
            return id;
        }

        function closeTab(id) {
            const index = tabs.findIndex(t => t.id === id);
            if (index === -1) return;
            
            tabs.splice(index, 1);
            
            if (tabs.length === 0) {
                createTab();
                return;
            }

            if (activeTabId === id) {
                const newIndex = Math.min(index, tabs.length - 1);
                switchTab(tabs[newIndex].id);
            }
            renderTabs();
        }

        function switchTab(id) {
            activeTabId = id;
            const tab = getActiveTab();
            if (tab) {
                urlInput.value = tab.isHome ? '' : tab.url;
                if (tab.isHome) {
                    homePage.style.display = 'flex';
                    browserFrame.style.display = 'none';
                } else {
                    homePage.style.display = 'none';
                    browserFrame.style.display = 'block';
                    browserFrame.src = tab.url;
                }
                updateNavButtons();
                updateBookmarkIcon();
            }
            renderTabs();
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId);
        }

        function renderTabs() {
            const existingTabs = tabBar.querySelectorAll('.tab');
            existingTabs.forEach(t => t.remove());

            tabs.forEach(tab => {
                const tabEl = document.createElement('button');
                tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                tabEl.innerHTML = `
                    <span class="tab-title">${tab.title}</span>
                    <span class="tab-close"><i class="bi bi-x"></i></span>
                `;
                tabEl.addEventListener('click', (e) => {
                    if (e.target.closest('.tab-close')) {
                        closeTab(tab.id);
                    } else {
                        switchTab(tab.id);
                    }
                });
                tabBar.insertBefore(tabEl, addTabBtn);
            });
        }

        // Navigation
        function navigateTo(input) {
            let url = input.trim();
            if (!url) return;

            // Check if it's a URL
            if (!url.match(/^https?:\/\//)) {
                if (url.includes('.') && !url.includes(' ')) {
                    url = 'https://' + url;
                } else {
                    // Search
                    url = searchEngines[currentEngine].url + encodeURIComponent(url);
                }
            }

            const tab = getActiveTab();
            if (!tab) return;

            tab.isHome = false;
            tab.url = url;
            tab.title = extractDomain(url);

            // Add to tab history
            if (tab.historyIndex < tab.history.length - 1) {
                tab.history = tab.history.slice(0, tab.historyIndex + 1);
            }
            tab.history.push(url);
            tab.historyIndex = tab.history.length - 1;

            // Add to global history
            addToHistory(url, tab.title);

            homePage.style.display = 'none';
            browserFrame.style.display = 'block';
            
            simulateLoading();
            browserFrame.src = url;
            urlInput.value = url;
            updateNavButtons();
            updateBookmarkIcon();
            renderTabs();
        }

        function goHome() {
            const tab = getActiveTab();
            if (!tab) return;
            tab.isHome = true;
            tab.title = 'New Tab';
            tab.url = '';
            homePage.style.display = 'flex';
            browserFrame.style.display = 'none';
            urlInput.value = '';
            updateNavButtons();
            renderTabs();
        }

        function goBack() {
            const tab = getActiveTab();
            if (!tab || tab.historyIndex <= 0) return;
            tab.historyIndex--;
            const url = tab.history[tab.historyIndex];
            tab.url = url;
            tab.title = extractDomain(url);
            browserFrame.src = url;
            urlInput.value = url;
            updateNavButtons();
            renderTabs();
        }

        function goForward() {
            const tab = getActiveTab();
            if (!tab || tab.historyIndex >= tab.history.length - 1) return;
            tab.historyIndex++;
            const url = tab.history[tab.historyIndex];
            tab.url = url;
            tab.title = extractDomain(url);
            browserFrame.src = url;
            urlInput.value = url;
            updateNavButtons();
            renderTabs();
        }

        function refresh() {
            const tab = getActiveTab();
            if (!tab || tab.isHome) return;
            simulateLoading();
            browserFrame.src = tab.url;
        }

        function updateNavButtons() {
            const tab = getActiveTab();
            if (!tab) return;
            backBtn.disabled = tab.historyIndex <= 0;
            forwardBtn.disabled = tab.historyIndex >= tab.history.length - 1;
            document.getElementById('bottomBack').disabled = tab.historyIndex <= 0;
            document.getElementById('bottomForward').disabled = tab.historyIndex >= tab.history.length - 1;
        }

        function simulateLoading() {
            loadingBar.style.width = '0%';
            loadingBar.style.transition = 'none';
            setTimeout(() => {
                loadingBar.style.transition = 'width 0.5s ease';
                loadingBar.style.width = '70%';
                setTimeout(() => {
                    loadingBar.style.width = '100%';
                    setTimeout(() => {
                        loadingBar.style.transition = 'none';
                        loadingBar.style.width = '0%';
                    }, 300);
                }, 500);
            }, 50);
        }

        // Bookmarks
        function addToBookmarks(url, title) {
            if (bookmarks.find(b => b.url === url)) {
                showToast('Already bookmarked');
                return;
            }
            bookmarks.push({ url, title, date: Date.now() });
            localStorage.setItem('via_bookmarks', JSON.stringify(bookmarks));
            updateBookmarkIcon();
            showToast('Bookmarked!');
        }

        function removeFromBookmarks(url) {
            bookmarks = bookmarks.filter(b => b.url !== url);
            localStorage.setItem('via_bookmarks', JSON.stringify(bookmarks));
            updateBookmarkIcon();
            showToast('Bookmark removed');
        }

        function updateBookmarkIcon() {
            const tab = getActiveTab();
            if (!tab || tab.isHome) {
                bookmarkBtn.innerHTML = '<i class="bi bi-star"></i>';
                return;
            }
            const isBookmarked = bookmarks.find(b => b.url === tab.url);
            bookmarkBtn.innerHTML = isBookmarked ? '<i class="bi bi-star-fill"></i>' : '<i class="bi bi-star"></i>';
        }

        // History
        function addToHistory(url, title) {
            history.unshift({ url, title, date: Date.now() });
            if (history.length > 100) history = history.slice(0, 100);
            localStorage.setItem('via_history', JSON.stringify(history));
        }

        // Panels
        function openPanel(type) {
            closeAllMenus();
            panelTitle.textContent = type.charAt(0).toUpperCase() + type.slice(1);
            
            if (type === 'bookmarks') {
                renderBookmarksPanel();
            } else if (type === 'history') {
                renderHistoryPanel();
            } else if (type === 'settings') {
                renderSettingsPanel();
            }

            sidePanel.classList.add('open');
            overlay.classList.add('show');
        }

        function closePanel() {
            sidePanel.classList.remove('open');
            overlay.classList.remove('show');
        }

        function renderBookmarksPanel() {
            if (bookmarks.length === 0) {
                panelContent.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="bi bi-star" style="font-size:32px;display:block;margin-bottom:12px"></i>No bookmarks yet</div>';
                return;
            }
            panelContent.innerHTML = bookmarks.map((b, i) => `
                <div class="panel-item" data-url="${b.url}">
                    <div class="panel-item-icon"><i class="bi bi-globe"></i></div>
                    <div class="panel-item-info">
                        <div class="panel-item-title">${b.title}</div>
                        <div class="panel-item-subtitle">${b.url}</div>
                    </div>
                    <button class="panel-item-delete" data-index="${i}"><i class="bi bi-trash"></i></button>
                </div>
            `).join('');

            panelContent.querySelectorAll('.panel-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.panel-item-delete')) return;
                    navigateTo(item.dataset.url);
                    closePanel();
                });
            });

            panelContent.querySelectorAll('.panel-item-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = parseInt(btn.dataset.index);
                    bookmarks.splice(index, 1);
                    localStorage.setItem('via_bookmarks', JSON.stringify(bookmarks));
                    renderBookmarksPanel();
                    updateBookmarkIcon();
                });
            });
        }

        function renderHistoryPanel() {
            if (history.length === 0) {
                panelContent.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)"><i class="bi bi-clock-history" style="font-size:32px;display:block;margin-bottom:12px"></i>No history yet</div>';
                return;
            }
            panelContent.innerHTML = history.map(h => `
                <div class="panel-item" data-url="${h.url}">
                    <div class="panel-item-icon"><i class="bi bi-clock"></i></div>
                    <div class="panel-item-info">
                        <div class="panel-item-title">${h.title}</div>
                        <div class="panel-item-subtitle">${formatTime(h.date)} · ${h.url}</div>
                    </div>
                </div>
            `).join('');

            panelContent.querySelectorAll('.panel-item').forEach(item => {
                item.addEventListener('click', () => {
                    navigateTo(item.dataset.url);
                    closePanel();
                });
            });
        }

        function renderSettingsPanel() {
            panelContent.innerHTML = `
                <div class="settings-group">
                    <div class="settings-group-title">Appearance</div>
                    <div class="settings-item" id="nightModeToggle">
                        <div class="settings-item-left">
                            <i class="bi bi-moon"></i>
                            <span class="settings-item-label">Night Mode</span>
                        </div>
                        <div class="toggle ${nightMode ? '' : 'active'}" id="nightToggle"></div>
                    </div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-title">Search</div>
                    <div class="settings-item" id="searchEngineSetting">
                        <div class="settings-item-left">
                            <i class="bi bi-search"></i>
                            <span class="settings-item-label">Search Engine</span>
                        </div>
                        <span style="font-size:12px;color:var(--text-secondary)">${searchEngines[currentEngine].name}</span>
                    </div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-title">Privacy</div>
                    <div class="settings-item" id="adBlockToggle">
                        <div class="settings-item-left">
                            <i class="bi bi-shield-check"></i>
                            <span class="settings-item-label">Ad Blocker</span>
                        </div>
                        <div class="toggle ${adBlock ? 'active' : ''}" id="adToggle"></div>
                    </div>
                    <div class="settings-item" id="clearHistoryBtn">
                        <div class="settings-item-left">
                            <i class="bi bi-trash"></i>
                            <span class="settings-item-label">Clear History</span>
                        </div>
                    </div>
                    <div class="settings-item" id="clearBookmarksBtn">
                        <div class="settings-item-left">
                            <i class="bi bi-star"></i>
                            <span class="settings-item-label">Clear Bookmarks</span>
                        </div>
                    </div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-title">About</div>
                    <div class="settings-item">
                        <div class="settings-item-left">
                            <i class="bi bi-info-circle"></i>
                            <span class="settings-item-label">Via Browser v1.0</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('nightModeToggle').addEventListener('click', () => {
                nightMode = !nightMode;
                document.body.classList.toggle('light-mode');
                document.getElementById('nightToggle').classList.toggle('active');
                localStorage.setItem('via_nightmode', nightMode);
            });

            document.getElementById('adBlockToggle').addEventListener('click', () => {
                adBlock = !adBlock;
                document.getElementById('adToggle').classList.toggle('active');
                localStorage.setItem('via_adblock', adBlock);
                showToast(adBlock ? 'Ad blocker enabled' : 'Ad blocker disabled');
            });

            document.getElementById('clearHistoryBtn').addEventListener('click', () => {
                history = [];
                localStorage.setItem('via_history', '[]');
                showToast('History cleared');
            });

            document.getElementById('clearBookmarksBtn').addEventListener('click', () => {
                bookmarks = [];
                localStorage.setItem('via_bookmarks', '[]');
                updateBookmarkIcon();
                showToast('Bookmarks cleared');
            });

            document.getElementById('searchEngineSetting').addEventListener('click', () => {
                closePanel();
                showEngineDropdown();
            });
        }

        // Tab Overview
        function showTabOverview() {
            closeAllMenus();
            tabGrid.innerHTML = tabs.map(tab => `
                <div class="tab-card ${tab.id === activeTabId ? 'active' : ''}" data-id="${tab.id}">
                    <div class="tab-card-preview">
                        <i class="bi bi-globe"></i>
                    </div>
                    <div class="tab-card-info">
                        <span class="tab-card-title">${tab.title}</span>
                        <button class="tab-card-close" data-close="${tab.id}"><i class="bi bi-x"></i></button>
                    </div>
                </div>
            `).join('');

            tabGrid.querySelectorAll('.tab-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.tab-card-close')) return;
                    switchTab(parseInt(card.dataset.id));
                    hideTabOverview();
                });
            });

            tabGrid.querySelectorAll('.tab-card-close').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeTab(parseInt(btn.dataset.close));
                    showTabOverview();
                });
            });

            tabOverview.classList.add('show');
        }

        function hideTabOverview() {
            tabOverview.classList.remove('show');
        }

        // Search Engine
        function showEngineDropdown() {
            const rect = engineSelector.getBoundingClientRect();
            engineDropdown.style.top = (rect.bottom + 4) + 'px';
            engineDropdown.style.left = rect.left + 'px';
            engineDropdown.classList.add('show');
        }

        function updateEngineUI() {
            const engine = searchEngines[currentEngine];
            document.getElementById('engineName').textContent = engine.name;
            engineSelector.querySelector('i:first-child').className = `bi ${engine.icon}`;
            document.querySelectorAll('.engine-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.engine === currentEngine);
            });
        }

        // Utilities
        function extractDomain(url) {
            try {
                const u = new URL(url);
                return u.hostname.replace('www.', '');
            } catch {
                return url.substring(0, 30);
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function closeAllMenus() {
            contextMenu.classList.remove('show');
            engineDropdown.classList.remove('show');
        }

        // Event Listeners
        addTabBtn.addEventListener('click', () => createTab());

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                navigateTo(urlInput.value);
                urlInput.blur();
            }
        });

        urlInput.addEventListener('focus', () => {
            urlInput.select();
        });

        homeSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                navigateTo(homeSearchInput.value);
            }
        });

        backBtn.addEventListener('click', goBack);
        forwardBtn.addEventListener('click', goForward);
        refreshBtn.addEventListener('click', refresh);
        homeBtn.addEventListener('click', goHome);

        bookmarkBtn.addEventListener('click', () => {
            const tab = getActiveTab();
            if (!tab || tab.isHome) return;
            const existing = bookmarks.find(b => b.url === tab.url);
            if (existing) {
                removeFromBookmarks(tab.url);
            } else {
                addToBookmarks(tab.url, tab.title);
            }
        });

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeAllMenus();
            const rect = menuBtn.getBoundingClientRect();
            contextMenu.style.top = (rect.bottom + 4) + 'px';
            contextMenu.style.right = '12px';
            contextMenu.style.left = 'auto';
            contextMenu.classList.add('show');
        });

        engineSelector.addEventListener('click', (e) => {
            e.stopPropagation();
            closeAllMenus();
            showEngineDropdown();
        });

        document.querySelectorAll('.engine-option').forEach(opt => {
            opt.addEventListener('click', () => {
                currentEngine = opt.dataset.engine;
                localStorage.setItem('via_engine', currentEngine);
                updateEngineUI();
                engineDropdown.classList.remove('show');
            });
        });

        panelClose.addEventListener('click', closePanel);
        overlay.addEventListener('click', closePanel);

        document.querySelectorAll('.context-menu-item').forEach(item => {
            item.addEventListener('click', () => {
                const action = item.dataset.action;
                closeAllMenus();
                switch (action) {
                    case 'back': goBack(); break;
                    case 'forward': goForward(); break;
                    case 'refresh': refresh(); break;
                    case 'bookmark': bookmarkBtn.click(); break;
                    case 'history': openPanel('history'); break;
                    case 'nightmode':
                        nightMode = !nightMode;
                        document.body.classList.toggle('light-mode');
                        localStorage.setItem('via_nightmode', nightMode);
                        break;
                    case 'settings': openPanel('settings'); break;
                }
            });
        });

        // Bottom bar
        document.getElementById('bottomBack').addEventListener('click', goBack);
        document.getElementById('bottomForward').addEventListener('click', goForward);
        document.getElementById('bottomBookmarks').addEventListener('click', () => openPanel('bookmarks'));
        document.getElementById('bottomTabs').addEventListener('click', showTabOverview);
        document.getElementById('bottomMenu').addEventListener('click', (e) => {
            e.stopPropagation();
            closeAllMenus();
            const rect = e.currentTarget.getBoundingClientRect();
            contextMenu.style.top = (rect.top - 10) + 'px';
            contextMenu.style.right = '12px';
            contextMenu.style.left = 'auto';
            contextMenu.style.bottom = 'auto';
            contextMenu.classList.add('show');
        });

        document.getElementById('closeOverview').addEventListener('click', hideTabOverview);

        // Quick links
        document.querySelectorAll('.quick-link').forEach(link => {
            link.addEventListener('click', () => {
                navigateTo(link.dataset.url);
            });
        });

        // Close menus on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.context-menu') && !e.target.closest('#menuBtn') && !e.target.closest('#bottomMenu')) {
                contextMenu.classList.remove('show');
            }
            if (!e.target.closest('.engine-dropdown') && !e.target.closest('#engineSelector')) {
                engineDropdown.classList.remove('show');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 't':
                        e.preventDefault();
                        createTab();
                        break;
                    case 'w':
                        e.preventDefault();
                        closeTab(activeTabId);
                        break;
                    case 'l':
                        e.preventDefault();
                        urlInput.focus();
                        urlInput.select();
                        break;
                    case 'r':
                        e.preventDefault();
                        refresh();
                        break;
                }
            }
        });

        // Frame load events
        browserFrame.addEventListener('load', () => {
            try {
                const tab = getActiveTab();
                if (tab && browserFrame.contentDocument) {
                    tab.title = browserFrame.contentDocument.title || extractDomain(tab.url);
                    renderTabs();
                }
            } catch (e) {
                // Cross-origin, ignore
            }
        });

        // Initialize engine UI
